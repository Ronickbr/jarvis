<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis Command Center</title>
  <desc id="desc">Prévia da interface escura em estilo HUD com painel de conversa e status dos provedores.</desc>
  <defs><radialGradient id="glow"><stop stop-color="#153d43"/><stop offset="1" stop-color="#05090d"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="18"/></filter></defs>
  <rect width="1440" height="900" fill="#05090d"/><circle cx="930" cy="250" r="300" fill="#0b5058" opacity=".13" filter="url(#blur)"/><rect width="235" height="900" fill="#03080b" stroke="#173237"/>
  <g font-family="Arial, sans-serif">
    <rect x="26" y="30" width="42" height="42" rx="9" fill="#0b1b1f" stroke="#338c92"/><text x="47" y="57" text-anchor="middle" font-size="19" fill="#47e7ed">◈</text><text x="82" y="48" font-size="15" font-weight="700" letter-spacing="4" fill="#eaf8fa">JARVIS</text><text x="82" y="65" font-size="8" letter-spacing="2" fill="#657d82">COMMAND OS</text>
    <rect x="16" y="111" width="203" height="43" rx="7" fill="#0c1b1f"/><rect x="16" y="111" width="2" height="43" fill="#47e7ed"/><text x="47" y="138" font-size="12" fill="#dffbfc">⌁  Central</text><text x="47" y="188" font-size="12" fill="#788d92">◉  Conversas</text><text x="47" y="236" font-size="12" fill="#788d92">›_  Ferramentas</text><text x="47" y="284" font-size="12" fill="#788d92">⌁  Atividade</text>
    <line x1="26" y1="812" x2="209" y2="812" stroke="#173237"/><circle cx="45" cy="850" r="18" fill="#12242a"/><text x="45" y="854" text-anchor="middle" font-size="9" fill="#47e7ed">RS</text><text x="75" y="847" font-size="11" fill="#cedde0">Operador</text><text x="75" y="863" font-size="8" fill="#657d82">Acesso local</text>
    <line x1="235" y1="64" x2="1440" y2="64" stroke="#173237"/><circle cx="275" cy="32" r="4" fill="#47e7ed"/><text x="288" y="36" font-size="9" letter-spacing="1" fill="#9cc4c8">NÚCLEO ONLINE</text><text x="1255" y="36" font-size="9" letter-spacing="1" fill="#657d82">08 SET 2026  •  21:42 UTC</text>
    <text x="837" y="125" text-anchor="middle" font-size="9" letter-spacing="2" fill="#47e7ed">✦ ASSISTENTE OPERACIONAL</text><text x="837" y="174" text-anchor="middle" font-size="37" font-weight="500" fill="#eaf8fa">Boa noite, <tspan fill="#47e7ed">senhor.</tspan></text><text x="837" y="205" text-anchor="middle" font-size="12" fill="#71878c">Todos os sistemas estão operacionais. Aguardando sua próxima instrução.</text>
    <circle cx="837" cy="320" r="86" fill="none" stroke="#27767d" stroke-dasharray="5 7"/><circle cx="837" cy="320" r="70" fill="none" stroke="#163b40"/><circle cx="837" cy="320" r="50" fill="url(#glow)" stroke="#205c62"/><text x="837" y="315" text-anchor="middle" font-size="29" fill="#47e7ed">◈</text><text x="837" y="341" text-anchor="middle" font-size="8" letter-spacing="2" fill="#47e7ed">PRONTO</text><circle cx="837" cy="234" r="4" fill="#47e7ed"/>
    <g font-size="8" fill="#567076" letter-spacing="1"><text x="630" y="439">PROVEDORES</text><text x="808" y="439">POLÍTICA</text><text x="970" y="439">VOZ</text></g><g font-size="11" fill="#b9d8da"><text x="630" y="458">0/4</text><text x="808" y="458">ATIVA</text><text x="970" y="458">PT-BR</text></g>
    <rect x="360" y="493" width="955" height="270" rx="12" fill="#081115" stroke="#173237"/><circle cx="404" cy="539" r="17" fill="#0c2429" stroke="#205158"/><text x="404" y="544" text-anchor="middle" font-size="14" fill="#47e7ed">◈</text><text x="435" y="527" font-size="8" letter-spacing="1" fill="#58747a">JARVIS · AGORA</text><text x="435" y="553" font-size="13" fill="#c8d9dc">Sistemas prontos. Em que posso ajudar hoje?</text>
    <line x1="360" y1="694" x2="1315" y2="694" stroke="#173237"/><rect x="377" y="708" width="40" height="40" rx="8" fill="#0b191d" stroke="#173237"/><text x="397" y="733" text-anchor="middle" font-size="17" fill="#86a2a6">●</text><text x="437" y="733" font-size="12" fill="#53696e">Diga ou digite uma instrução...</text><rect x="1195" y="712" width="61" height="31" rx="6" fill="#0b171b"/><text x="1225" y="731" text-anchor="middle" font-size="8" fill="#85a3a7">AUTO</text><rect x="1263" y="708" width="40" height="40" rx="8" fill="#47e7ed"/><text x="1283" y="733" text-anchor="middle" font-size="16" fill="#041013">➤</text>
    <g font-size="10"><rect x="360" y="777" width="230" height="48" rx="8" fill="#081115" stroke="#142c31"/><circle cx="382" cy="801" r="3" fill="#44565a"/><text x="394" y="798" fill="#91aaae">OpenAI</text><text x="394" y="812" font-size="8" fill="#4e6266">sem chave</text><rect x="602" y="777" width="230" height="48" rx="8" fill="#081115" stroke="#142c31"/><circle cx="624" cy="801" r="3" fill="#44565a"/><text x="636" y="798" fill="#91aaae">Anthropic</text><text x="636" y="812" font-size="8" fill="#4e6266">sem chave</text><rect x="844" y="777" width="230" height="48" rx="8" fill="#081115" stroke="#142c31"/><circle cx="866" cy="801" r="3" fill="#44565a"/><text x="878" y="798" fill="#91aaae">Gemini</text><text x="878" y="812" font-size="8" fill="#4e6266">sem chave</text><rect x="1086" y="777" width="229" height="48" rx="8" fill="#081115" stroke="#142c31"/><circle cx="1108" cy="801" r="3" fill="#44565a"/><text x="1120" y="798" fill="#91aaae">xAI</text><text x="1120" y="812" font-size="8" fill="#4e6266">sem chave</text></g>
  </g>
