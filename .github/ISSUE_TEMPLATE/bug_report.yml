name: Bug
description: Relate um comportamento incorreto reproduzível
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu e o que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: "1. Inicie...\n2. Envie...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente e logs sem segredos
    validations:
      required: true
